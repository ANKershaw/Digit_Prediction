[project]
name = "digit-prediction"
version = "0.1.0"
description = "A handwritten digit prediction service. Capstone project for ML Zoomcamp."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.128.0",
    "keras-image-helper>=0.0.2",
    "matplotlib>=3.10.8",
    "onnxruntime>=1.23.2",
    "onnxscript>=0.5.7",
    "pandas>=2.3.3",
    "python-multipart>=0.0.21",
    "requests>=2.32.5",
    "sympy>=1.14.0",
    "torch>=2.9.1",
    "torchvision>=0.24.1",
    "uvicorn>=0.40.0",
]
